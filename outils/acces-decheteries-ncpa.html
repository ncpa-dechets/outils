<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temps d'accès</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<style>
:root{
  --rouge:#B91E27; --encre:#1d2125; --gris:#6b7078; --gris2:#9aa0a6; --trait:#e6e8ea; --fond:#f4f5f6;
  --vert:#2f9e44; --ombre:0 6px 28px rgba(20,24,28,.14), 0 1px 3px rgba(20,24,28,.08);
  font-family: Calibri, "Segoe UI", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--encre);background:#e9eaec;overflow:hidden}
#map{position:absolute;inset:0}
.leaflet-container{font-family:inherit;background:#eceeef}
.card{position:absolute;z-index:1000;background:#fff;border-radius:14px;box-shadow:var(--ombre)}
#card{top:14px;left:14px;width:340px;max-height:calc(100% - 28px);overflow-y:auto;padding:16px 18px 14px;border-top:3px solid var(--rouge)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--rouge);font-weight:700}
h1{font-size:17px;line-height:1.2;margin:2px 0 12px;font-weight:700}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);font-weight:700;margin-bottom:3px}
.sep{height:1px;background:var(--trait);margin:12px 0}
.muted{color:var(--gris);font-size:12.5px;line-height:1.35}
input[type=search],input[type=text],select{font:inherit;font-size:14px;width:100%;padding:8px 12px;border:1px solid var(--trait);border-radius:999px;background:var(--fond);color:var(--encre)}
input[type=search]:focus,input[type=text]:focus,select:focus{outline:none;border-color:#c4c8cc;background:#fff}
select{border-radius:8px;padding:6px 8px;font-size:13px}
button{font:inherit;cursor:pointer;color:var(--encre)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--rouge);outline-offset:1px}
.pill{border:1px solid #d6d9dc;background:#fff;border-radius:999px;padding:5px 12px;font-size:13px}
.pill:hover{border-color:#b9bdc2;background:var(--fond)}
.pill.on{background:var(--encre);border-color:var(--encre);color:#fff}
.link{border:0;background:none;padding:0;color:var(--vert);font-size:13px;text-decoration:underline;text-underline-offset:2px}
#search-res ul{list-style:none;margin:6px 0 0;padding:4px 0;background:#fff;border:1px solid var(--trait);border-radius:10px;max-height:220px;overflow:auto;box-shadow:var(--ombre)}
#search-res li{padding:6px 12px;font-size:13px;cursor:pointer}
#search-res li:hover{background:var(--fond)}
#results{margin-top:12px}
.loading{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--gris);padding:10px 0 2px}
.loading.err{color:var(--rouge);align-items:flex-start}
.spin{width:14px;height:14px;flex:0 0 14px;border:2px solid #d6d9dc;border-top-color:var(--rouge);border-radius:50%;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.place{font-size:17px;font-weight:700;line-height:1.25}
.headrow{display:flex;justify-content:space-between;align-items:baseline}
.bigtime{font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.bigtime small{font-size:15px;font-weight:400;color:var(--gris);margin-left:8px;letter-spacing:0}
.steps{margin-top:10px}
.step{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:5px 0;font-size:13.5px}
.step .t{color:var(--gris);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{width:20px;height:20px;border-radius:5px;color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .pill{display:inline-flex;align-items:center;gap:6px}
.chips .dot{width:9px;height:9px;border-radius:50%}
.grad{height:10px;border-radius:999px;margin-top:10px}
.ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--gris);margin-top:3px;font-variant-numeric:tabular-nums}
.sect-leg{display:flex;flex-direction:column;gap:3px;margin-top:10px;font-size:12.5px}
.sect-leg span{display:flex;align-items:center;gap:7px}
.sect-leg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
#settings{top:14px;right:14px;width:320px;max-height:calc(100% - 90px);overflow-y:auto;padding:14px 16px}
#settings h2{font-size:15px;margin:0}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;margin:7px 0}
.srow label{display:flex;gap:7px;align-items:center;cursor:pointer}
.eqitem{display:flex;align-items:center;gap:7px;margin:4px 0}
.eqitem input{padding:4px 10px;font-size:12.5px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.btnrow .pill{font-size:12px;padding:4px 10px}
#statsbar{position:absolute;z-index:900;left:50%;transform:translateX(-50%);bottom:14px;background:#fff;border-radius:999px;box-shadow:var(--ombre);padding:7px 16px;font-size:12.5px;color:var(--gris);white-space:nowrap}
#statsbar b{color:var(--encre)}
#sheet{left:368px;right:14px;bottom:14px;height:38vh;display:flex;flex-direction:column;overflow:hidden}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--trait)}
.sheet-head b{margin-right:auto;font-size:14px}
.sheet-body{overflow:auto;flex:1}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:5px 10px;border-bottom:1px solid #f0f1f2;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#fff;cursor:pointer;user-select:none;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--fond)}
.hidden{display:none!important}
/* éléments sur la carte */
.startmark{width:20px;height:20px;border-radius:50%;background:#16191c;border:4px solid #fff;box-shadow:0 0 0 1.5px #16191c,0 2px 8px rgba(0,0,0,.35);cursor:grab}
.dmark{width:24px;height:24px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.dmark.ext{background:#fff!important;border:2.5px dashed var(--c);color:var(--c)}
.dmark.off{opacity:.45}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gris);border:1px solid #d6d9dc;border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.badge.ext{background:#fff!important;border:2px dashed var(--c);color:var(--c)}
.dmark.edit{outline:2px dashed #16191c;outline-offset:2px;cursor:move}
.leaflet-tooltip.tt-dark{background:#16191c;color:#fff;border:0;border-radius:7px;padding:4px 8px;font-weight:700;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.leaflet-tooltip.tt-dark:before{display:none}
.leaflet-tooltip.tt-start{background:var(--vert);color:#fff;border:0;border-radius:7px;padding:3px 9px;font-weight:700;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.leaflet-tooltip.tt-start:before{border-top-color:var(--vert)}
.iso-lbl{display:inline-block;transform:translate(-50%,-50%);background:rgba(255,255,255,.92);border-radius:999px;padding:1px 7px;font-size:11.5px;font-weight:700;color:#16191c;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.leaflet-control-zoom,.leaflet-control-layers{border:0!important;box-shadow:var(--ombre)!important;border-radius:10px!important;overflow:hidden}
@media (max-width:860px){
  #card{width:auto;right:14px;max-height:52vh}
  #settings{left:14px;right:14px;width:auto;top:auto;bottom:60px;max-height:55vh}
  #sheet{left:14px}
  #statsbar{font-size:11.5px;padding:6px 12px}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="card" class="card">
  <div class="eyebrow" id="h-eyebrow"></div>
  <h1 id="h-titre"></h1>
  <input id="search" type="search" placeholder="Rechercher une adresse du territoire…" autocomplete="off">
  <div id="search-res"></div>
  <div id="loading" class="loading"><span class="spin"></span><span id="loading-txt">Démarrage…</span></div>
  <div id="results"></div>
  <div class="sep"></div>
  <div class="lbl">Carte des temps</div>
  <div id="chips" class="chips"></div>
  <div id="legend"></div>
  <label id="row-ext" class="srow hidden" style="margin-top:10px"><span style="display:flex;gap:7px;align-items:center"><input type="checkbox" id="chk-ext" checked> <span id="lbl-ext"></span></span></label>
  <div class="foot">
    <button id="btn-settings" class="pill">Réglages</button>
    <button id="btn-table" class="pill">Tableau par commune</button>
  </div>
</div>

<div id="settings" class="card hidden">
  <div class="headrow"><h2>Réglages</h2><button class="link" id="btn-close-settings">Fermer</button></div>
  <div id="status" class="muted" style="margin-top:6px"></div>
  <div class="sep"></div>
  <div class="lbl">Affichage</div>
  <div class="srow" id="row-coef"><span>Circulation</span>
    <select id="coef" style="width:auto">
      <option value="1">Fluide (×1)</option>
      <option value="1.15" selected>Normale (×1,15)</option>
      <option value="1.3">Chargée, été (×1,3)</option>
    </select></div>
  <div class="srow"><span>Opacité</span><input id="opacity" type="range" min="0" max="100" value="70" style="width:140px"></div>
  <div class="srow"><label><input type="checkbox" id="chk-smooth" checked> Zones lissées</label></div>
  <div class="srow"><label><input type="checkbox" id="chk-contours" checked> Courbes isochrones</label></div>
  <div class="srow"><label><input type="checkbox" id="chk-allroutes" checked> Itinéraire vers chaque équipement</label></div>
  <p class="muted" id="note-temps" style="margin:6px 0 0"></p>
  <div class="sep"></div>
  <div class="lbl">Équipements</div>
  <input id="eq-type" type="text" title="Type d'équipement, utilisé dans les libellés" style="margin:4px 0 6px">
  <div id="destlist"></div>
  <div class="btnrow">
    <button id="btn-edit" class="pill">Déplacer sur la carte</button>
    <label class="pill" style="cursor:pointer" title="CSV (nom;lat;lon ou colonne WKT) ou GeoJSON de points en WGS84">Importer…<input id="file-dest" type="file" accept=".csv,.txt,.geojson,.json" class="hidden"></label>
    <button id="btn-export-dest" class="pill">Exporter</button>
    <button id="btn-reset-dest" class="pill" title="Revenir aux équipements par défaut">Réinitialiser</button>
  </div>
  <p class="muted" id="note-eq" style="margin:6px 0 0"></p>
  <div class="sep"></div>
  <div class="lbl">Réseau</div>
  <div class="btnrow">
    <button id="btn-reload" class="pill" title="Retélécharger communes et réseau depuis Internet">Recharger depuis OSM</button>
    <label class="pill" style="cursor:pointer" title="Ouvrir un réseau enregistré (évite le téléchargement)">Ouvrir un réseau…<input id="file-net" type="file" accept=".json" class="hidden"></label>
    <button id="btn-save" class="pill" disabled>Enregistrer le réseau</button>
  </div>
</div>

<div id="statsbar">Population à moins de 10 min <b id="st-10">–</b> · 15 min <b id="st-15">–</b> · temps moyen <b id="st-mean">–</b> <span style="color:var(--gris2)">(centres de communes)</span></div>

<div id="sheet" class="card hidden">
  <div class="sheet-head"><b>Temps par commune</b><button id="btn-export-tab" class="pill">Exporter (CSV)</button><button id="btn-close-sheet" class="link">Fermer</button></div>
  <div class="sheet-body"><table id="tab"><thead></thead><tbody></tbody></table></div>
</div>

<script>
"use strict";
"use strict";
/* ================================================================
   CONFIGURATION — seul bloc à modifier pour un nouvel usage
   (remplacé automatiquement par scripts/generer_outil.py)
   ================================================================ */
const CONFIG = /*CONFIG_DEBUT*/{
  "titre": "Temps d'accès en voiture aux déchèteries",
  "surtitre": "NCPA · Service déchets",
  "territoire": {
    "epci_siren": "200065563",
    "communes_insee": []
  },
  "profil": "voiture",
  "pas_minutes": 5,
  "equipements": {
    "type": "déchèterie",
    "items": [
      {
        "nom": "Déchèterie de Bréville les Monts",
        "lat": 49.224488,
        "lon": -0.228139
      },
      {
        "nom": "Déchèterie de Merville-Franceville-Plage",
        "lat": 49.277661,
        "lon": -0.201604
      },
      {
        "nom": "Déchèterie de Périers-en-Auge",
        "lat": 49.25823,
        "lon": -0.09976
      },
      {
        "nom": "Déchèterie de Cambremer",
        "lat": 49.146062,
        "lon": 0.044338,
        "externe": true
      },
      {
        "nom": "Déchèterie de Villers-sur-Mer",
        "lat": 49.308626,
        "lon": -0.019442,
        "externe": true
      }
    ]
  },
  "libelle_externe": "hors NCPA",
  "note_equipements": "Positions issues du relevé des déchèteries. Les ajustements faits sur la carte sont mémorisés dans ce navigateur."
}/*CONFIG_FIN*/;

/* Profils de déplacement : réseau OSM retenu, vitesses (km/h), sens uniques */
const PROFILS = {
  voiture: {
    libelle: "en voiture",
    filtre: "^(motorway|motorway_link|trunk|trunk_link|primary|primary_link|secondary|secondary_link|tertiary|tertiary_link|unclassified|residential|living_street|service|road)$",
    exclusions: '["access"!~"^(no|private)$"]["motor_vehicle"!~"^(no|private)$"]["service"!~"^(parking_aisle|driveway|drive-through|emergency_access)$"]',
    vitesses: { motorway:110, motorway_link:60, trunk:90, trunk_link:50, primary:75, primary_link:45, secondary:65, secondary_link:40,
      tertiary:55, tertiary_link:35, unclassified:45, road:40, residential:30, living_street:15, service:20 },
    vitesse_defaut: 30, maxspeed: true, sens_uniques: true, acces_kmh: 15, coef_trafic: true
  },
  velo: {
    libelle: "à vélo",
    filtre: "^(primary|primary_link|secondary|secondary_link|tertiary|tertiary_link|unclassified|residential|living_street|service|road|cycleway|track|path|pedestrian)$",
    exclusions: '["access"!~"^(no|private)$"]["bicycle"!~"^(no|dismount)$"]',
    vitesses: { cycleway:16, track:12, path:12, pedestrian:8, living_street:12 },
    vitesse_defaut: 15, maxspeed: false, sens_uniques: true, acces_kmh: 5, coef_trafic: false
  },
  pied: {
    libelle: "à pied",
    filtre: "^(primary|primary_link|secondary|secondary_link|tertiary|tertiary_link|unclassified|residential|living_street|service|road|footway|pedestrian|steps|path|track|cycleway)$",
    exclusions: '["access"!~"^(no|private)$"]["foot"!~"^no$"]',
    vitesses: { steps: 2 },
    vitesse_defaut: 4.5, maxspeed: false, sens_uniques: false, acces_kmh: 4, coef_trafic: false
  }
};
const PROFIL = PROFILS[CONFIG.profil] || PROFILS.voiture;
const DEFAULT_DEST = CONFIG.equipements;
const ACCESS_SPEED = PROFIL.acces_kmh / 3.6;  // m/s entre le point cliqué et la voie la plus proche
const BBOX_MARGIN = 0.03;                    // marge (degrés) autour du territoire pour le réseau
const RASTER_WIDTH = 520;                    // résolution horizontale de la carte des temps (pixels)
const MAX_DETAIL = 30;
/* Courbes isochrones : majeures (étiquetées, toutes les 2 tranches) et mineures */
const CONTOUR_STYLE = { couleur: "#3a3f45", majeure: { epaisseur: 0.9, opacite: 0.35 }, mineure: { epaisseur: 0.6, opacite: 0.18 } };                       // au-delà, seul l'équipement le plus proche est détaillé
const STORE_KEY = "iso-" + CONFIG.titre.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g, "-").slice(0, 60);
const OVERPASS = ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter"];
const DEST_COLORS = ["#2E6DA4","#D9822B","#4E8F3A","#7B4FA0","#C0392B","#16838C","#8C6D1F","#C2477E","#4A5A6A","#5C8DD6"];
const TIME_CLASSES = (() => {
  const p = CONFIG.pas_minutes || 5, cols = ["#1a9641","#a6d96a","#ffffbf","#fdae61","#e2543a","#8b1a1a"];
  return cols.map((color, i) => i < 5
    ? { max: p*(i+1), color, label: i === 0 ? `moins de ${p} min` : `${p*i} à ${p*(i+1)} min` }
    : { max: Infinity, color, label: `plus de ${p*5} min` });
})();

/* ================================================================
   Fonctions de calcul (indépendantes de l'affichage)
   ================================================================ */
function haversine(lat1, lon1, lat2, lon2){
  const R = 6371000, r = Math.PI/180;
  const dLat = (lat2-lat1)*r, dLon = (lon2-lon1)*r;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function parseMaxspeed(v){
  if(!v) return null;
  v = String(v).trim().toLowerCase();
  if(v === "fr:urban") return 50; if(v === "fr:rural") return 80;
  if(v === "fr:motorway") return 130; if(v === "fr:zone30") return 30;
  if(v === "walk") return 6;
  if(v.includes("mph")) return null;
  const n = parseFloat(v); return isFinite(n) && n > 0 ? n : null;
}
function wayDirection(tags){
  // 3 = double sens, 1 = sens de numérisation, 2 = sens inverse
  if(!PROFIL.sens_uniques) return 3;
  if(CONFIG.profil === "velo" && tags["oneway:bicycle"] === "no") return 3;
  const ow = (tags.oneway || "").toLowerCase();
  if(ow === "-1" || ow === "reverse") return 2;
  if(ow === "yes" || ow === "1" || ow === "true") return 1;
  if(ow === "no" || ow === "false" || ow === "0") return 3;
  if(tags.junction === "roundabout" || tags.junction === "circular") return 1;
  if(CONFIG.profil === "voiture" && (tags.highway === "motorway" || tags.highway === "motorway_link")) return 1;
  return 3;
}
function wayLinkSpeed(tags){
  const hw = tags.highway; const def = PROFIL.vitesses[hw] || PROFIL.vitesse_defaut;
  const mx = PROFIL.maxspeed ? parseMaxspeed(tags.maxspeed) : null;
  return mx ? Math.min(mx*0.85, def*1.3) : def;   // km/h
}

/* Transforme la réponse Overpass en réseau compact (noeuds + tronçons) */
function overpassToNetwork(json){
  const coords = new Map();
  for(const el of json.elements) if(el.type === "node") coords.set(el.id, [el.lat, el.lon]);
  const idx = new Map(); const lat = [], lon = [];
  const ea = [], eb = [], len = [], cost = [], dir = [];
  const getIdx = id => {
    let i = idx.get(id);
    if(i === undefined){ const c = coords.get(id); if(!c) return -1; i = lat.length; idx.set(id, i); lat.push(c[0]); lon.push(c[1]); }
    return i;
  };
  for(const el of json.elements){
    if(el.type !== "way" || !el.tags || !el.nodes) continue;
    const d = wayDirection(el.tags); const v = wayLinkSpeed(el.tags) / 3.6;
    for(let k = 0; k < el.nodes.length - 1; k++){
      const a = getIdx(el.nodes[k]), b = getIdx(el.nodes[k+1]);
      if(a < 0 || b < 0 || a === b) continue;
      const L = haversine(lat[a], lon[a], lat[b], lon[b]);
      ea.push(a); eb.push(b); len.push(Math.round(L*10)/10); cost.push(Math.round(L/v*100)/100); dir.push(d);
    }
  }
  return { lat, lon, ea, eb, len, cost, dir };
}

/* Construit le graphe "inversé" (pour calculer le temps de chaque noeud VERS un équipement) */
function buildGraph(net){
  const n = net.lat.length, m = net.ea.length;
  const lat = Float64Array.from(net.lat), lon = Float64Array.from(net.lon);
  const deg = new Int32Array(n + 1);
  for(let e = 0; e < m; e++){ const d = net.dir[e]; if(d & 1) deg[net.eb[e]]++; if(d & 2) deg[net.ea[e]]++; }
  const start = new Int32Array(n + 1);
  for(let i = 0; i < n; i++) start[i+1] = start[i] + deg[i];
  const fill = start.slice(0, n);
  const to = new Int32Array(start[n]), c = new Float32Array(start[n]), l = new Float32Array(start[n]);
  for(let e = 0; e < m; e++){
    const a = net.ea[e], b = net.eb[e], d = net.dir[e];
    if(d & 1){ const p = fill[b]++; to[p] = a; c[p] = net.cost[e]; l[p] = net.len[e]; } // a→b autorisé

      while(i > 0){ const p = (i-1) >> 1; if(hk[p] <= k) break; hk[i] = hk[p]; hv[i] = hv[p]; i = p; } hk[i] = k; hv[i] = v; };

function inRing(x, y, ring){

    console.error(e);
    setLoading("Échec du téléchargement : " + esc(e.message) + ". Réessayez via Réglages › « Recharger depuis OSM », ou ouvrez un réseau enregistré.", true);
  }
}
function installData(com, net, label){
  S.communes = com; S.net = net;
  S.G = buildGraph(net); S.IX = buildIndex(S.G); S.fwd = makeForwardSolver(S.G);
  communesLayer.clearLayers();
  com.forEach(c => communesLayer.addData({ type: "Feature", properties: { nom: c.nom }, geometry: c.contour }));
  const fb = communesLayer.getBounds(); S.dest.items.forEach(d => fb.extend([d.lat, d.lon]));
  map.fitBounds(fb, { paddingTopLeft: [window.innerWidth > 860 ? 360 : 10, 10], paddingBottomRight: [10, 40] });
  $("status").textContent = (label || "Réseau " + PROFIL.libelle + " prêt") + ` : ${com.length} communes, ${S.G.mainSize.toLocaleString("fr-FR")} nœuds.`;
  $("btn-save").disabled = false;
  setLoading(null);
  buildRaster();
  if(!map.hasLayer(startMarker)){
    const h = location.hash.match(/from=(-?[\d.]+),(-?[\d.]+)/);
    startMarker.setLatLng(h ? [ +h[1], +h[2] ] : communesLayer.getBounds().getCenter()).addTo(map);
  }
  recomputeAll();
}

/* ================================================================
   Calculs vers les équipements
   ================================================================ */
function recomputeAll(){
  if(!S.G) return;
  const snaps = S.dest.items.map((d, k) => ({ k, node: isActive(k) ? nearestNode(S.G, S.IX, d.lat, d.lon, 20).node : -1 }));
  S.near = dijkstra(S.G, snaps);
  S.per = S.dest.items.length <= MAX_DETAIL ? snaps.map(s => s.node >= 0 ? dijkstra(S.G, [s]) : null) : [];
  if(!["from", "near", "sect"].includes(S.mode) && !S.per[+S.mode]) S.mode = "from";
  const hasExt = S.dest.items.some(d => d.externe);
  $("row-ext").classList.toggle("hidden", !hasExt);
  $("lbl-ext").textContent = `Inclure les ${plural(S.dest.type)} ${EXT()}`;
  drawDestMarkers(); drawDestList(); drawChips(); computeTable(); updatePoint(true);
}

/* ================================================================
   Carte des temps (grille de pixels, lissage, courbes)
   ================================================================ */
function buildRaster(){
  const b = communesBBox(S.communes), crs = L.CRS.EPSG3857;
  const p1 = crs.project(L.latLng(b.s, b.w)), p2 = crs.project(L.latLng(b.n, b.e));
  const W = RASTER_WIDTH, res = (p2.x - p1.x) / W, H = Math.ceil((p2.y - p1.y) / res);
  const node = new Int32Array(W*H), acc = new Float32Array(W*H);
  const rowLat = new Float64Array(H), colLng = new Float64Array(W);
  for(let j = 0; j < H; j++) rowLat[j] = crs.unproject(L.point(p1.x, p2.y - (j+0.5)*res)).lat;
  for(let i = 0; i < W; i++) colLng[i] = crs.unproject(L.point(p1.x + (i+0.5)*res, p2.y)).lng;
  for(let j = 0; j < H; j++) for(let i = 0; i < W; i++){
    const r = nearestNode(S.G, S.IX, rowLat[j], colLng[i], 6);
    node[j*W+i] = r.node; acc[j*W+i] = r.dist / ACCESS_SPEED;
  }
  const mask = document.createElement("canvas"); mask.width = W; mask.height = H;
  const mx = mask.getContext("2d"); mx.fillStyle = "#000";
  for(const c of S.communes){
    const polys = c.contour.type === "Polygon" ? [c.contour.coordinates] : c.contour.coordinates;
    mx.beginPath();
    for(const poly of polys) for(const ring of poly){
      ring.forEach(([lo, la], q) => { const p = crs.project(L.latLng(la, lo)); const x = (p.x - p1.x)/res, y = (p2.y - p.y)/res; q ? mx.lineTo(x, y) : mx.moveTo(x, y); });
      mx.closePath();
    }
    mx.fill("evenodd");
  }
  const md = mx.getImageData(0, 0, W, H).data, inside = new Uint8Array(W*H);
  for(let p = 0; p < W*H; p++) inside[p] = md[p*4+3] > 100 ? 1 : 0;
  const canvas = document.createElement("canvas"); canvas.width = W; canvas.height = H;
  const bounds = L.latLngBounds(crs.unproject(L.point(p1.x, p2.y - H*res)), crs.unproject(L.point(p2.x, p2.y)));
  S.raster = { W, H, node, acc, mask, inside, canvas, bounds, rowLat, colLng,
    field: new Float32Array(W*H), tmp: new Float32Array(W*H), lut: null, lutKey: "" };
  if(S.overlay) map.removeLayer(S.overlay);
  S.overlay = new CanvasOverlay(canvas, bounds, { pane: "raster", opacity: $("opacity").value/100, interactive: false }).addTo(map);
}
function hexRGB(h){ const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const STEP = CONFIG.pas_minutes || 5, CAPMIN = STEP * 8;
/* Table de couleurs continue : vert → jaune → rouge, puis estompage au-delà de la dernière tranche */
function rampLUT(){
  const stops = TIME_CLASSES.map((c, i) => [i * STEP, hexRGB(c.color)]);
  const lut = new Uint8ClampedArray(256 * 4);
  for(let q = 0; q < 256; q++){
    const m = q / 255 * CAPMIN; let rgb, a = 255;
    if(m >= stops[stops.length-1][0]){ rgb = stops[stops.length-1][1]; a = Math.round(255 - Math.min(1, (m - 5*STEP) / (2*STEP)) * 150); }
    else { let s = 0; while(m > stops[s+1][0]) s++; const t = (m - stops[s][0]) / (stops[s+1][0] - stops[s][0]);
      rgb = stops[s][1].map((v, k) => Math.round(v + (stops[s+1][1][k] - v) * t)); }
    lut.set([rgb[0], rgb[1], rgb[2], a], q*4);
  }
  return lut;
}
const LUT = rampLUT(), CLASS_RGB = TIME_CLASSES.map(c => hexRGB(c.color));

function currentTimes(){
  if(S.mode === "from") return (map.hasLayer(startMarker) && S.startNode >= 0)
    ? { time: S.fwd(S.startNode, (TIME_CLASSES[TIME_CLASSES.length-2].max * 60 / coef()) + 120) } : null;
  if(S.mode === "near" || S.mode === "sect") return S.near;
  return S.per[+S.mode] || null;
}
function renderRaster(){
  const R = S.raster; if(!R || !S.near) return;
  const ctx = R.canvas.getContext("2d"); ctx.globalCompositeOperation = "source-over";
  const img = ctx.createImageData(R.W, R.H), d = img.data, N = R.W * R.H;
  const arr = currentTimes(), k = coef();
  contourLayer.clearLayers();
  if(arr && S.mode === "sect"){
    const destRGB = S.dest.items.map((_, i) => hexRGB(destColor(i)));
    for(let p = 0; p < N; p++){ const nd = R.node[p]; if(nd < 0) continue; const s = S.near.src[nd]; if(s < 0) continue;
      const rgb = destRGB[s]; d[p*4] = rgb[0]; d[p*4+1] = rgb[1]; d[p*4+2] = rgb[2]; d[p*4+3] = 235; }
  } else if(arr){
    const F = R.field;
    for(let p = 0; p < N; p++){
      const nd = R.node[p], t = nd >= 0 ? arr.time[nd] : Infinity;
      F[p] = isFinite(t) ? Math.min(CAPMIN, (t + R.acc[p]) * k / 60) : CAPMIN;
    }
    const smooth = $("chk-smooth").checked;
    if(smooth) blurField(F, R.W, R.H, 3, R.tmp);
    for(let p = 0; p < N; p++){
      const m = F[p];
      if(smooth){ const q = Math.min(255, Math.round(m / CAPMIN * 255)) * 4; d[p*4] = LUT[q]; d[p*4+1] = LUT[q+1]; d[p*4+2] = LUT[q+2]; d[p*4+3] = LUT[q+3]; }
      else { let ci = 0; while(m >= TIME_CLASSES[ci].max) ci++; const rgb = CLASS_RGB[ci]; d[p*4] = rgb[0]; d[p*4+1] = rgb[1]; d[p*4+2] = rgb[2]; d[p*4+3] = 255; }
    }
    if($("chk-contours").checked) drawContours(F);
  }
  ctx.putImageData(img, 0, 0);
  ctx.globalCompositeOperation = "destination-in"; ctx.drawImage(R.mask, 0, 0);
  ctx.globalCompositeOperation = "source-over";
}
/* Courbes isochrones : tracées en vecteur (nettes à tout niveau de zoom) */
function drawContours(F){
  const R = S.raster;
  const toLL = (x, y) => {
    const j0 = Math.max(0, Math.min(R.H - 2, Math.floor(y))), ty = y - j0;
    const i0 = Math.max(0, Math.min(R.W - 2, Math.floor(x))), tx = x - i0;
    return [R.rowLat[j0] + (R.rowLat[j0+1] - R.rowLat[j0]) * ty, R.colLng[i0] + (R.colLng[i0+1] - R.colLng[i0]) * tx];
  };
  let ax = R.W / 2, ay = R.H / 2;
  if(S.mode === "from" && map.hasLayer(startMarker)){
    const ll = startMarker.getLatLng();
    ax = (ll.lng - R.colLng[0]) / (R.colLng[R.W-1] - R.colLng[0]) * (R.W - 1);
    let j = 0; while(j < R.H - 1 && R.rowLat[j] > ll.lat) j++; ay = j;
  }
  for(let c = 1; c <= 5; c++){
    const level = c * STEP, major = c % 2 === 0;
    const segs = contourSegments(F, R.W, R.H, level, R.inside);
    if(!segs.length) continue;
    // étiquette : sur la courbe, à la verticale au-dessus du départ (ou du centre de la carte), loin des bords
    const lines = []; let top = -1, best = Infinity;
    for(let s = 0; s < segs.length; s += 4){
      lines.push([toLL(segs[s], segs[s+1]), toLL(segs[s+2], segs[s+3])]);
      const x = segs[s], y = segs[s+1];
      if(x < 8 || x > R.W - 8 || y < 8 || y > R.H - 8) continue;
      const cost = Math.abs(x - ax) + (y > ay ? 4 * (y - ay) + 20 : 0);
      if(cost < best){ best = cost; top = s; }
    }
    const st = major ? CONTOUR_STYLE.majeure : CONTOUR_STYLE.mineure;
    L.polyline(lines, { renderer: contourRenderer, color: CONTOUR_STYLE.couleur, weight: st.epaisseur, opacity: st.opacite, interactive: false }).addTo(contourLayer);
    if(major && top >= 0) L.marker(toLL(segs[top], segs[top+1]), { pane: "isolbl", interactive: false, keyboard: false,
      icon: L.divIcon({ className: "", html: `<span class="iso-lbl">${level} min</span>`, iconSize: [0, 0] }) }).addTo(contourLayer);
  }
}

   Point de départ
   ================================================================ */
let raf = 0;
const schedule = () => { if(!raf) raf = requestAnimationFrame(() => { raf = 0; updatePoint(true); }); };
startMarker.on("dragstart", () => { S.startLabel = null; });
startMarker.on("drag", schedule);
startMarker.on("dragend", () => { updatePoint(true); updateHash(); });
map.on("click", e => { if(!S.G || S.editMode) return; S.startLabel = null; startMarker.setLatLng(e.latlng); updatePoint(true); updateHash(); });
function updateHash(){ const ll = startMarker.getLatLng(); history.replaceState(null, "", "#from=" + ll.lat.toFixed(5) + "," + ll.lng.toFixed(5)); }

function updatePoint(redraw){
  routesLayer.clearLayers();
  if(!S.G || !S.near || !map.hasLayer(startMarker)) return;
  const ll = startMarker.getLatLng();
  const sn = nearestNode(S.G, S.IX, ll.lat, ll.lng, 12);
  S.startNode = sn.node;
  if(redraw) renderRaster();
  const com = S.communes.find(c => inGeom(ll.lng, ll.lat, c.contour));
  const place = S.startLabel || (com ? com.nom : "Hors du territoire");
  if(sn.node < 0){ $("results").innerHTML = `<div class="lbl">Départ</div><div class="place">${esc(place)}</div><p class="muted">Aucune voie trouvée à proximité.</p>`; return; }
  const acc = sn.dist / ACCESS_SPEED, k = coef();
  let rows = S.per.length
    ? S.per.map((r, i) => r && ({ i, t: (r.time[sn.node] + acc) * k, km: r.dist[sn.node] + sn.dist, res: r })).filter(Boolean)
    : (S.near.src[sn.node] >= 0 ? [{ i: S.near.src[sn.node], t: (S.near.time[sn.node] + acc) * k, km: S.near.dist[sn.node] + sn.dist, res: S.near }] : []);
  rows.sort((a, b) => a.t - b.t);
  S.lastRows = rows;
  const all = $("chk-allroutes").checked;
  rows.slice().reverse().forEach(r => {
    const best = r === rows[0];
    if((!best && !all) || !isFinite(r.t)) return;
    const pts = [[ll.lat, ll.lng]].concat(tracePath(S.G, r.res, sn.node));
    L.polyline(pts, { pane: "routes", color: "#fff", weight: best ? 8 : 5.5, opacity: 0.95, interactive: false }).addTo(routesLayer);
    L.polyline(pts, { pane: "routes", color: destColor(r.i), weight: best ? 4.5 : 2.5, opacity: best ? 1 : 0.9, dashArray: best ? null : "5 6", interactive: false }).addTo(routesLayer);
  });
  // étiquettes des équipements
  const showLbl = S.dest.items.length <= 6;
  S.destMarkers.forEach((m, i) => {
    const r = rows.find(x => x.i === i);
    const txt = esc(shortName(S.dest.items[i].nom)) + (r ? " · " + fmtMin(r.t) : (S.dest.items[i].externe && !S.useExt ? " · non incluse" : ""));
    m.setTooltipContent(txt);
    if(showLbl && !m.isTooltipOpen()) m.openTooltip();
  });
  const b = rows[0];
  $("results").innerHTML = `
    <div class="headrow"><div class="lbl">Départ</div>${S.startLabel ? '<button class="link" id="btn-clear-addr">Effacer</button>' : ""}</div>
    <div class="place">${esc(place)}</div>
    <div class="sep"></div>
    ${b ? `<div class="lbl">Accès le plus rapide</div>
    <div class="place">${esc(S.dest.items[b.i].nom)}${S.dest.items[b.i].externe ? `<span class="tag">${esc(EXT())}</span>` : ""}</div>
    <div class="bigtime">${fmtMin(b.t)}<small>${fmtKm(b.km)}</small></div>` : ""}
    <div class="steps">${rows.slice(1, 10).map(r => `<div class="step">
      ${badge(r.i)}
      <span>${esc(S.dest.items[r.i].nom)}${S.dest.items[r.i].externe ? `<span class="tag">${esc(EXT())}</span>` : ""}</span>
      <span class="t">${fmtMin(r.t)} · ${fmtKm(r.km)}</span></div>`).join("")}</div>
    ${rows.length > 10 ? `<div class="muted">… et ${rows.length - 10} autres.</div>` : ""}`;
  const clr = $("btn-clear-addr");
  if(clr) clr.onclick = () => { S.startLabel = null; $("search").value = ""; updatePoint(false); };
}

/* ================================================================
   Tableau par commune et statistiques
   ================================================================ */
function computeTable(){
  if(!S.G || !S.near) return;
  const k = coef();
  S.tabRows = S.communes.map(c => {
    const [lo, la] = c.centre.coordinates;
    const sn = nearestNode(S.G, S.IX, la, lo, 12);
    const acc = sn.node >= 0 ? sn.dist / ACCESS_SPEED : Infinity;
    const t = sn.node >= 0 ? (S.near.time[sn.node] + acc) * k : Infinity;
    const iNear = sn.node >= 0 ? S.near.src[sn.node] : -1;
    const per = S.per.map(r => r && sn.node >= 0 ? (r.time[sn.node] + acc) * k : Infinity);
    return { nom: c.nom, code: c.code, pop: c.population, t, near: iNear >= 0 ? S.dest.items[iNear].nom : "–", per, lat: la, lon: lo };
  });
  let P = 0, p10 = 0, p15 = 0, sum = 0;
  for(const r of S.tabRows){ if(!isFinite(r.t)) continue; P += r.pop; sum += r.pop * r.t; if(r.t <= 600) p10 += r.pop; if(r.t <= 900) p15 += r.pop; }
  const pct = v => P ? Math.round(v/P*100) + " %" : "–";
  $("st-10").textContent = pct(p10); $("st-15").textContent = pct(p15);
  $("st-mean").textContent = P ? fmtMin(sum/P) : "–";
  drawTable();
}
function drawTable(){
  const cols = [["nom", "Commune"], ["pop", "Population"], ["near", "Le plus proche"], ["t", "Temps"]]
    .concat(S.per.length <= 6 ? S.per.map((r, i) => r ? ["p" + i, shortName(S.dest.items[i].nom)] : null).filter(Boolean) : []);
  const val = (r, c) => /^p\d+$/.test(c) ? r.per[+c.slice(1)] : r[c];
  const { col, asc } = S.sort;
  const rows = S.tabRows.slice().sort((a, b) => { const x = val(a, col), y = val(b, col);
    return (typeof x === "string" ? x.localeCompare(y, "fr") : x - y) * (asc ? 1 : -1); });
  $("tab").tHead.innerHTML = "<tr>" + cols.map(([c, t]) => `<th data-c="${c}">${esc(t)}${c === col ? (asc ? " ▲" : " ▼") : ""}</th>`).join("") + "</tr>";
  $("tab").tBodies[0].innerHTML = rows.map(r => `<tr data-la="${r.lat}" data-lo="${r.lon}" data-n="${esc(r.nom)}"><td>${esc(r.nom)}</td><td class="n">${r.pop.toLocaleString("fr-FR")}</td><td>${esc(r.near)}</td><td class="n"><b>${fmtMin(r.t)}</b></td>` +
    (S.per.length <= 6 ? r.per.map((t, i) => S.per[i] ? `<td class="n">${fmtMin(t)}</td>` : "").join("") : "") + "</tr>").join("");
  $("tab").tHead.querySelectorAll("th").forEach(th => th.onclick = () => {
    const c = th.dataset.c; S.sort = { col: c, asc: S.sort.col === c ? !S.sort.asc : true }; drawTable(); });
  $("tab").tBodies[0].querySelectorAll("tr").forEach(tr => tr.onclick = () => {
    const ll = [+tr.dataset.la, +tr.dataset.lo]; S.startLabel = tr.dataset.n + " (centre)";
    startMarker.setLatLng(ll); map.panTo(ll); updatePoint(true); updateHash(); });
}
$("btn-table").addEventListener("click", () => { const on = $("sheet").classList.toggle("hidden") === false; $("btn-table").classList.toggle("on", on); });
$("btn-close-sheet").addEventListener("click", () => { $("sheet").classList.add("hidden"); $("btn-table").classList.remove("on"); });
$("btn-export-tab").addEventListener("click", () => {
  if(!S.tabRows.length) return;
  const keep = S.per.map((r, i) => !!r);
  const head = ["commune", "code_insee", "population", "plus_proche", "temps_min"].concat(S.per.map((_, i) => "min_" + S.dest.items[i].nom.replace(/[;\s]+/g, "_")).filter((_, i) => keep[i]));
  const lines = S.tabRows.map(r => [r.nom, r.code, r.pop, r.near, isFinite(r.t) ? (r.t/60).toFixed(1).replace(".", ",") : ""]
    .concat(r.per.filter((_, i) => keep[i]).map(t => isFinite(t) ? (t/60).toFixed(1).replace(".", ",") : "")).join(";"));
  download("temps_acces_par_commune.csv", "\uFEFF" + head.join(";") + "\n" + lines.join("\n"), "text/csv");
});

/* ================================================================
   Réglages
   ================================================================ */
$("btn-settings").addEventListener("click", () => { const on = $("settings").classList.toggle("hidden") === false; $("btn-settings").classList.toggle("on", on); });
$("btn-close-settings").addEventListener("click", () => { $("settings").classList.add("hidden"); $("btn-settings").classList.remove("on"); });
$("coef").addEventListener("change", () => { computeTable(); updatePoint(true); });
$("opacity").addEventListener("input", e => S.overlay && S.overlay.setOpacity(e.target.value/100));
$("chk-smooth").addEventListener("change", () => { drawLegend(); renderRaster(); });
$("chk-contours").addEventListener("change", renderRaster);
$("chk-allroutes").addEventListener("change", () => updatePoint(false));
$("chk-ext").addEventListener("change", e => { S.useExt = e.target.checked; recomputeAll(); });

/* ================================================================
   Recherche d'adresse (BAN, limitée aux communes du territoire)
   ================================================================ */
let st = 0;
$("search").addEventListener("input", e => {
  clearTimeout(st); const q = e.target.value.trim();
  if(q.length < 3){ $("search-res").innerHTML = ""; return; }
  st = setTimeout(async () => {
    try{
      const c = communesLayer.getBounds().getCenter();
      const r = await fetch("https://api-adresse.data.gouv.fr/search/?limit=15&q=" + encodeURIComponent(q) + `&lat=${c.lat}&lon=${c.lng}`);
      const j = await r.json();
      const codes = new Set((S.communes || []).map(c => c.code));
      const f = j.features.filter(x => !codes.size || codes.has(x.properties.citycode)).slice(0, 6);
      $("search-res").innerHTML = f.length ? "<ul>" + f.map((x, i) => `<li data-i="${i}">${esc(x.properties.label)}</li>`).join("") + "</ul>"
        : '<div class="muted" style="margin-top:6px">Aucune adresse trouvée sur le territoire.</div>';
      $("search-res").querySelectorAll("li").forEach(li => li.onclick = () => {
        const x = f[+li.dataset.i], [lo, la] = x.geometry.coordinates;
        S.startLabel = x.properties.label;
        startMarker.setLatLng([la, lo]); map.setView([la, lo], Math.max(map.getZoom(), 13)); updatePoint(true); updateHash();
        $("search-res").innerHTML = ""; $("search").value = x.properties.label;
      });
    }catch(err){ $("search-res").innerHTML = '<div class="muted" style="margin-top:6px">Recherche d\'adresse indisponible.</div>'; }
  }, 300);
});

/* ================================================================
   Enregistrer / ouvrir un réseau
   ================================================================ */
function download(name, content, type){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
$("btn-save").addEventListener("click", () => {
  const n = S.net, r6 = v => Math.round(v * 1e6) / 1e6;
  const out = { format: "ncpa-reseau-v1", profil: CONFIG.profil, date: new Date().toISOString().slice(0, 10), communes: S.communes,
    lat: n.lat.map(r6), lon: n.lon.map(r6), ea: n.ea, eb: n.eb, len: n.len, cost: n.cost, dir: n.dir };
  download(`reseau_${CONFIG.profil}_${out.date}.json`, JSON.stringify(out), "application/json");
});
$("file-net").addEventListener("change", async e => {
  const f = e.target.files[0]; if(!f) return; e.target.value = "";
  try{
    setLoading("Lecture du réseau enregistré…");
    const j = JSON.parse(await f.text());
    if(j.format !== "ncpa-reseau-v1") throw new Error("ce fichier n'est pas un réseau enregistré par cet outil");
    if(j.profil && j.profil !== CONFIG.profil) throw new Error(`ce réseau a été enregistré pour le profil « ${j.profil} », pas « ${CONFIG.profil} »`);
    installData(j.communes, j, `Réseau du ${j.date} ouvert`);
  }catch(err){ setLoading("Ouverture impossible : " + esc(err.message), true); }
});
$("btn-reload").addEventListener("click", loadFromInternet);

/* Démarrage */
document.title = CONFIG.titre;
$("h-titre").textContent = CONFIG.titre; $("h-eyebrow").textContent = CONFIG.surtitre || "";
$("note-eq").textContent = CONFIG.note_equipements || "";
$("note-temps").textContent = "Temps théoriques calculés sur le réseau OpenStreetMap " + PROFIL.libelle +
  (PROFIL.coef_trafic ? ", sans trafic réel ni temps de stationnement." : ", à vitesse constante.");
if(!PROFIL.coef_trafic) $("row-coef").classList.add("hidden");
drawDestList(); drawChips();
loadFromInternet();
})(); }
</script>
